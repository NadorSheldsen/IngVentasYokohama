<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión - Yokohama</title>
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="icon" type="image/png" href="/img/yokohamalogoT.png" />
  </head>
  <body>
    <!-- Gradiente rojo difuminado animado -->
    <div class="red-gradient"></div>

    <!-- Botón de cambio de tema -->
    <div class="theme-toggle" onclick="toggleTheme()">
      <span class="theme-icon" id="themeIcon">🌙</span>
    </div>

    <!-- Contenedor de login -->
    <div class="login-container">
      <!-- Logo -->
      <div class="logo-container">
        <a href="index.html" aria-label="Ir a inicio">
          <img src="/img/yokohamalogo.png" alt="Yokohama Logo" />
        </a>
      </div>

      <!-- Tarjeta de login -->
      <div class="login-card">
        <h1>Iniciar Sesión</h1>
        <p>Ingresa tus credenciales para continuar</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">Correo Electrónico</label>
            <input
              type="email"
              id="username"
              name="username"
              placeholder="Ingresa tu correo"
              required
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="login-button" id="loginButton">
            Iniciar Sesión
          </button>
        </form>

        <!-- Mensaje de error -->
        <div id="errorMessage" class="error-message"></div>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
