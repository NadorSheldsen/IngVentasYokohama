<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semáforos - Yokohama</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark-theme');
          }
          window.__THEME_IS_DARK__ = isDark;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/semaforo.css" />
    <link rel="icon" type="image/png" href="/img/yokohamalogoT.png" />
  </head>
  <body>
    <header class="top-header">
      <a href="index.html" aria-label="Ir a inicio">
        <img src="/img/yokohamalogo.png" alt="Yokohama Logo" class="brand-logo" id="brandLogo" />
      </a>
      <script>
        (function() {
          var logo = document.getElementById('brandLogo');
          if (logo && window.__THEME_IS_DARK__) {
            logo.src = '/img/yokohamalogoblanco.png';
          }
        })();
      </script>
      <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
        <span id="themeIcon">🌙</span>
      </button>
    </header>

    <div class="red-line">
      <main class="menu-row">
        <button type="button" class="menu-btn" id="btnGoInicio">Administración Actividades</button>
        <button type="button" class="menu-btn" id="btnAdminIncentivos">Administración incentivos</button>
        <button type="button" class="menu-btn" id="btnAdminRendimientos">Administración Rendimientos</button>
        <div class="user-menu" id="userMenu">
          <div class="user-pill" id="userMenuToggle" aria-label="Usuario actual" role="button" tabindex="0">
            <span class="user-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </span>
            <span id="userName">Usuario</span>
          </div>
          <div class="user-dropdown" id="userDropdown" aria-hidden="true">
            <button type="button" class="logout-btn" id="logoutBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
              </svg>
              Log out
            </button>
          </div>
        </div>
      </main>
    </div>

    <section class="desecho-section" id="semaforoSection">
      <div class="desecho-header">
        <div class="section-title-row">
          <h2>Semáforos</h2>
          <nav class="quick-access-icons" aria-label="Accesos rápidos por flota">
            <a href="desecho.html" class="quick-icon-btn" title="Pruebas de desecho" aria-label="Pruebas de desecho">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8"></circle>
                <circle cx="12" cy="12" r="5"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <path d="M7 17.5l10 0"></path>
                <path d="M7 15.2l10 0"></path>
                <path d="M7 19.8l10 0"></path>
              </svg>
            </a>
            <a href="inspeccion.html" class="quick-icon-btn" title="Inspección vehicular" aria-label="Inspección vehicular">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 20l3.5-3.5"></path>
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <path d="M8.5 10.5h4"></path>
                <path d="M10.5 8.5v4"></path>
                <path d="M15 13h4l1.5 1.5V18h-1"></path>
                <circle cx="16.5" cy="18" r="1"></circle>
                <circle cx="19.5" cy="18" r="1"></circle>
              </svg>
            </a>
            <a href="semaforo.html" class="quick-icon-btn is-active" title="Pruebas de semáforo" aria-label="Pruebas de semáforo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="7" y="3" width="10" height="18" rx="2"></rect>
                <circle cx="12" cy="8" r="1.7"></circle>
                <circle cx="12" cy="12" r="1.7"></circle>
                <circle cx="12" cy="16" r="1.7"></circle>
              </svg>
            </a>
            <a href="rendimientos.html" class="quick-icon-btn" title="Pruebas de rendimiento" aria-label="Pruebas de rendimiento">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 16a8 8 0 1 1 16 0"></path>
                <path d="M12 12l4-3"></path>
                <path d="M6.5 16h11"></path>
                <circle cx="12" cy="16" r="1"></circle>
              </svg>
            </a>
          </nav>
        </div>
      </div>

      <div class="desecho-main-container">
        <div class="panel-izquierdo">
          <div class="filtros-container">
            <button type="button" class="btn-filtro active" id="btnAlertaRetiro">ALERTA DE RETIRO</button>
            <button type="button" class="btn-filtro" id="btnPresionesInflado">PRESIONES DE INFLADO</button>
            <button type="button" class="btn-filtro" id="btnObservaciones">OBSERVACIONES</button>
            <button type="button" class="btn-filtro" id="btnTipoPiso">TIPO DE PISO</button>
            <button type="button" class="btn-filtro" id="btnMarcaModelo">MARCA / MODELO</button>
            <button type="button" class="btn-filtro" id="btnMedidas">MEDIDAS</button>
          </div>
        </div>

        <div class="charts-container" id="chartsContainer"></div>
      </div>

      <div class="acciones-container">
        <div class="exportar-container">
          <button type="button" class="btn-exportar" id="btnExportarExcel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
            </svg>
            Exportar a Excel
          </button>
        </div>
        <div class="email-container">
          <label for="emailInput">Enviar por email</label>
          <input type="text" id="emailInput" class="email-input" placeholder="Capturar emails separados por coma..." />
          <button type="button" class="btn-enviar" id="btnEnviarEmail">Enviar</button>
        </div>
      </div>

      <div class="table-container">
        <div class="table-header">
          <h3>Detalle de Semáforos</h3>
          <div class="table-summary">
            <span id="totalLlantas">Total de llantas analizadas: 0</span>
          </div>
        </div>
        <div id="semaforoList">
          <p class="loading-text">Cargando semáforos...</p>
        </div>
      </div>
    </section>

    <div class="photo-modal" id="photoModal" aria-hidden="true">
      <div class="photo-modal-content">
        <button class="photo-modal-close" id="btnClosePhotoModal" aria-label="Cerrar">&times;</button>
        <div class="photo-grid">
          <div class="photo-slot">
            <img id="photoModalImg1" alt="Foto 1" />
            <div class="photo-empty" id="photoModalEmpty1">Sin foto</div>
          </div>
          <div class="photo-slot">
            <img id="photoModalImg2" alt="Foto 2" />
            <div class="photo-empty" id="photoModalEmpty2">Sin foto</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="/js/semaforo.js"></script>
  </body>
</html>
